all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: true
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/SJMaks/financer_back/internal/features/users/transport:
    config:
      dir: "{{.InterfaceDir}}/test"
      filename: "mocks_test.go"
      pkgname: "{{.SrcPackageName}}_test"
      structname: "{{.Mock}}{{.InterfaceName}}"
    interfaces:
      UserService:
      AuthMiddleware:
  github.com/SJMaks/financer_back/internal/features/users/service:
    config:
      dir: "./test"
      filename: "mocks_repo_test.go"
      pkgname: "service_test"
      structname: "{{.Mock}}{{.InterfaceName}}"
    interfaces:
      UserRepository:
  github.com/SJMaks/financer_back/internal/core/auth:
    config:
      dir: "./test"
      filename: "mocks_token_manager_test.go"
      pkgname: "service_test"
      structname: "{{.Mock}}{{.InterfaceName}}"
    interfaces:
      TokenManager:
