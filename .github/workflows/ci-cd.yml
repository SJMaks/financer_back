
name: Financer CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Go application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build application
        run: go build ./...

  deploy:
    name: Deploy to VM
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    concurrency:
      group: financer-production
      cancel-in-progress: false

    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VM_SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VM_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Write .env on VM
        env:
          HTTP_ADDRESS:         ${{ vars.HTTP_ADDRESS }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          JWT_SECRET:           ${{ secrets.JWT_SECRET }}
          DB_PORT:              ${{ vars.DB_PORT }}
          DB_USER:              ${{ vars.DB_USER }}
          DB_PASSWORD:          ${{ secrets.DB_PASSWORD }}
          DB_NAME:              ${{ vars.DB_NAME }}
          REDIS_PASSWORD:       ${{ secrets.REDIS_PASSWORD }}
        run: |
          umask 077
          env \
            | grep -E '^(HTTP_ADDRESS|CORS_ALLOWED_ORIGINS|JWT_SECRET|DB_PORT|DB_USER|DB_PASSWORD|DB_NAME|REDIS_PASSWORD)=' \
            > /tmp/financer.env

          ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              "$VM_USER@$VM_HOST" \
              "umask 077 && cat > projects/financer_back/.env" \
              < /tmp/financer.env

          rm -f /tmp/financer.env

      - name: Deploy exact commit to VM
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -Eeuo pipefail

          COMMIT="$1"
          APP_DIR="projects/financer_back"

          cd "$APP_DIR"

          git fetch --prune origin main

          git cat-file -e "${COMMIT}^{commit}"

          git reset --hard "$COMMIT"

          echo "---start migrate up---"
          make --trace migrate-up
          echo "---finish migrate up---"

          echo "---start deploy---"
          make --trace financer-deploy
          echo "---finish deploy---"

          REMOTE
