services:
  financer:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/financer/Dockerfile
    container_name: financer
    environment:
      - HTTP_ADDRESS=${HTTP_ADDRESS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=financer_postgres
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    volumes:
      - ${PROJECT_ROOT}/_out/logs:/app/_out/logs
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      financer_postgres:
        condition: service_healthy
    restart: always
  financer_postgres:
    image: postgres:18
    container_name: financer_postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - financer_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always
  financer_postgres_migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
  port_forwarder:
    image: alpine/socat:1.8.1.3
    container_name: financer_postgres_port_forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:financer_postgres:5432
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
  swagger:
    build: 
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.26.0-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code

volumes:
  financer_postgres_data: